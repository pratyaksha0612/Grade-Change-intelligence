services:
  # Backend FastAPI Service
  - type: web
    name: gci-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # Provide mock environment variables for the dependencies so the app can start
      - key: KAFKA_BROKER_URL
        value: "mocked"
      - key: REDIS_URI
        value: "mocked"
      - key: POSTGRES_SERVER
        value: "mocked"
      - key: TIMESCALEDB_SERVER
        value: "mocked"

  # Frontend React (Vite) Static Site
  - type: web
    name: gci-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: gci-backend
          envVarKey: RENDER_EXTERNAL_URL

# Note: For Vite, VITE_API_URL will be injected at build time by Render.
# Trigger sync 2